<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokedex</title>

    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="./styles/header.css">
    <link rel="stylesheet" href="./styles/fonts.css">
    <link rel="stylesheet" href="./styles/gallery.css">
    <link rel="stylesheet" href="./styles/overlay.css">
    <link rel="stylesheet" href="./styles/overlay_stats.css">
    <link rel="stylesheet" href="./styles/card.css">
    <link rel="stylesheet" href="./styles/responsive.css">
    <link rel="icon" type="image/svg+xml" href="./assets/icons/pokeball-red.svg">
    <script src="./script.js"></script>
    <script src="./scripts/template.js"></script>
    <script src="./scripts/overlay.js"></script>
    <script src="./scripts/database.js"></script>
</head>

<body onclick="closeOverlay()" onload="init()">
    <header>
        <div class="mx-wth header">
            <a class="fx-ct" href="./index.html">
                <img id="pokeball-icon" src="./assets/icons/pokeball-red.svg">
                <img id="title-img" src="./assets/img/pokedex.svg"> 
            </a>
            <div class="menu-nav"></div>
            <div id="typ-nav" class="typ-nav"></div>
            <div class="fx-ct">
                <form>
                    <input class="search-input" type="search" id="pokeSearch" name="q" oninput="searchPokemon(event)" placeholder="Search here...">
                </form>
                <img id="nav-menu-icon" onclick="toggleMenu()" src="./assets/icons/hamburger-menu-icon.svg">               
            </div>
        </div>
    </header>

    <section class="poke-gallery fx-1">
        <div class="mx-wth" id="poke-gallery"></div>
        
        <div class="pagebar">
            <ul class="page-changer">
                <li onclick="pageFirst()">
                    <p><<</p>
                </li>
                <li onclick="pageMinus()">
                    <p><</p>
                </li>
                <div class="page-changer page-numbers">
                <li onclick="changePage(1)">
                    <p>1</p>
                </li>
                <li onclick="changePage(2)">
                    <p>2</p>
                </li>
                <li onclick="changePage(3)">
                    <p>3</p>
                </li>
                <li onclick="changePage(4)">
                    <p>4</p>
                </li>
                </div>
                <li onclick="pagePlus()">
                    <p>></p>
                </li>
                <li onclick="pageEnd()">
                    <p>>></p>
                </li>
            </ul>

            <div>
                <label for="pokeLimit"><span>Zeige:</span></label>
                <select id="pokeLimit" onchange="amountPerSite()">
                    <option value="10"selected>10</option>
                    <option value="20">20</option>
                    <option value="30">30</option>
                    <option value="40">40</option>
                </select>
                <span>pro Seite</span>
            </div>
        </div>

        <div id="loading-spinner" class="hidden">
            <span class="loader"><img src="./assets/icons/pokeball-red.svg" alt=""></span>
            <h2>Loading ... </h2>
        </div>
    </section>

    <section id="overlay" class="hidden"></section>

    <footer></footer>

</body>
<script src="./scripts/filterCards.js"></script>
</html>
